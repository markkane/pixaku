<section id="game" class="screen">
  <canvas id="gl" hidden></canvas>
  <canvas id="board"></canvas>
  <div class="bar glass"><button class="ib" id="gBack" aria-label="Zurück"></button>
    <div class="t"><b id="gName"></b><span id="gSub"></span></div>
    <div class="n" id="gNum"><span id="gTime">0:00</span><small id="gPct">0 %</small></div><i class="prog" id="gProg"></i></div>
  <div class="glass" id="mini" hidden><canvas class="px" id="miniCv"></canvas></div>
  <svg id="tutHi" aria-hidden="true"><polygon></polygon><circle r="13"></circle></svg>
  <div class="glass" id="coach" hidden><p id="coachTxt"></p><div class="row"><span id="coachStep"></span><button class="ghost" id="coachSkip">Überspringen</button></div></div>
  <div id="bubble"></div>
  <div class="tools glass">
    <button class="tb" id="tUndo"></button><button class="tb" id="tHint"></button><button class="tb" id="tMode"></button><button class="tb" id="tFit"></button><button class="tb" id="tSet"></button>
  </div>
</section>
