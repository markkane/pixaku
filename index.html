@font-face{font-family:'Figtree';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/figtree-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Figtree';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/figtree-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Figtree';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/figtree-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Figtree';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/figtree-latin-700-normal.woff2) format('woff2')}

#splash{position:fixed;inset:0;z-index:99;background:#06131b;display:grid;place-items:center;transition:opacity .45s}
#splash.off{opacity:0;pointer-events:none}
#splash.noanim div{animation:none}
#splash div{display:flex;flex-direction:column;align-items:center;gap:18px;font:700 34px 'Pixelify Sans',monospace;letter-spacing:.08em;color:#f1f7f5;animation:spl .7s cubic-bezier(.2,1.4,.4,1)}
#splash img{width:132px;height:132px;border-radius:30px;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 80px rgba(255,160,90,.25)}
@keyframes spl{from{transform:scale(.7);opacity:0}}

<style>
:root{
  /* Buntglas bei Nacht: eine Vollbild-App, das Brett ist die Bühne, Glasleisten schweben darüber. Eine Welt, bewusst nur dunkel. */
  --ink:#06131b; --ink2:#0d2430; --text:#f1f7f5; --muted:#a4b9bd;
  --coral:#ff7a59; --amber:#ffc857; --mint:#4fe3c1; --rose:#ff5d8f;
  --glass:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.05)); --line:rgba(255,255,255,.2);
  --display:'Pixelify Sans',ui-monospace,Menlo,monospace; --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
html.lock,html.lock body{height:100%;overflow:hidden;overscroll-behavior:none}
body{min-height:100%;margin:0;overflow-x:hidden;background:var(--ink);color:var(--text);font:500 15px/1.45 var(--body);-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--amber);outline-offset:2px}
h1,h2,h3,p{margin:0} h1,h2{text-wrap:balance}
[hidden]{display:none!important}

#bg{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 20% 0%,var(--ink2),var(--ink) 70%)}
#bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 26s ease-in-out infinite alternate}
#bg i:nth-child(1){width:62vmax;height:62vmax;left:-22vmax;top:-18vmax;background:#ff6a4d}
#bg i:nth-child(2){width:54vmax;height:54vmax;right:-20vmax;top:22vmax;background:#19c7a8;animation-duration:32s;animation-delay:-8s}
#bg i:nth-child(3){width:46vmax;height:46vmax;left:8vmax;bottom:-24vmax;background:#e0a02c;animation-duration:38s;animation-delay:-15s;opacity:.4}
#bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:26px 26px}
@keyframes drift{to{transform:translate(9vmax,6vmax) scale(1.15)}}

.glass{background:var(--glass);border:1px solid var(--line);border-radius:22px;-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);box-shadow:0 12px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.28)}
.screen{display:none;position:relative}
#game{position:fixed;inset:0}
.screen.on{display:block}

.wrap{max-width:920px;margin:0 auto;padding:calc(18px + var(--sat)) 18px calc(40px + var(--sab));display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:10px}
.ib{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);font:700 18px var(--display)}
.ib svg,.tb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:active,.tb:active,.primary:active{transform:scale(.96)}
[role=button]{cursor:pointer;touch-action:pan-y}
#file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
canvas.px{image-rendering:pixelated;image-rendering:crisp-edges}

/* Titelbild */
#home{position:fixed;inset:0}
.screen.on{animation:scr .3s ease-out}
@keyframes scr{from{opacity:0}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.hm{height:100%;max-width:520px;margin:0 auto;justify-content:center;align-items:center;padding:calc(16px + var(--sat)) 18px calc(24px + var(--sab));display:flex;flex-direction:column;gap:8px;position:relative}
.hm-top{display:flex;justify-content:flex-end;gap:8px}
.hm-top .ib{width:34px;height:34px;border-radius:11px}
#logo{align-self:center;display:block}
.tagline{text-align:center;color:var(--muted);font:500 clamp(9px,3vw,12.5px) var(--display);letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.stage{display:grid;place-items:center}
.zone{width:var(--colw,100%)}.z1{display:flex;flex-direction:column;gap:8px}
#hero{border-radius:24px;background:rgba(4,14,20,.5);border:1px solid var(--line);box-shadow:0 22px 60px rgba(0,0,0,.5),0 0 90px rgba(255,170,90,.2),inset 0 1px 0 rgba(255,255,255,.2)}
.menu{display:flex;flex-direction:column;gap:15px}
.gbtn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;border-radius:18px;font:700 19px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--text);background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.07));border:1px solid var(--line);box-shadow:0 6px 0 rgba(3,12,18,.6),0 14px 28px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.4);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);transition:transform .07s,box-shadow .07s}
.gbtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(3,12,18,.6),0 6px 14px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.4)}
.gbtn.go{min-height:60px;font-size:clamp(17px,5.6vw,23px);color:#2a1206;background:linear-gradient(180deg,#ffdc80,#ff8a5c);border-color:rgba(255,255,255,.55);box-shadow:0 6px 0 #a3421d,0 16px 32px rgba(255,122,89,.42),inset 0 2px 0 rgba(255,255,255,.65)}
.gbtn.go:active{box-shadow:0 2px 0 #a3421d,0 6px 14px rgba(255,122,89,.35),inset 0 2px 0 rgba(255,255,255,.65)}
.quad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(6px,2.4vw,10px)}
.gbtn.sq{flex-direction:column;gap:6px;padding:10px 1px 8px;font-size:clamp(9px,2.9vw,12.5px);letter-spacing:0;min-height:82px;min-width:0}
.gbtn.sq canvas{width:38px;height:38px;border-radius:8px}
.tag{position:absolute;top:-8px;right:-4px;font:700 11px var(--display);font-style:normal;text-transform:none;letter-spacing:0;padding:2px 7px;border-radius:99px;background:var(--rose);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.tag.done{background:var(--mint);color:#06221b}.tag.info{background:#12303c;border:1px solid var(--line)}
#bCont{justify-content:flex-start;padding:6px 14px 6px 8px;text-align:left;min-width:0}
#bCont>span{min-width:0;flex:1}#bCont b,#bCont small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}.duo .gbtn{min-height:56px;font-size:clamp(14px,4.5vw,19px);min-width:0}
.menu.has .duo .gbtn{min-height:46px;font-size:clamp(13px,4.1vw,17px)}.menu.has{gap:12px}
#bCont canvas{width:46px;height:46px;border-radius:10px;background:rgba(4,14,20,.35)}
#bCont small{font:600 12.5px var(--body);text-transform:none;letter-spacing:0;opacity:.78}
.mute{filter:blur(2.5px) saturate(.35);opacity:.75}
@media(max-height:680px){.gbtn.go{min-height:52px}.gbtn.sq{min-height:74px}.menu{gap:11px}.menu.has .duo .gbtn{min-height:42px}.duo .gbtn{min-height:50px}}
/* Tasten */
.primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:16px;font:700 19px var(--display);letter-spacing:.05em;text-transform:uppercase;color:#2a1206;background:linear-gradient(180deg,#ffdc80,#ff8a5c);box-shadow:0 5px 0 #a3421d,0 12px 24px rgba(255,122,89,.35),inset 0 2px 0 rgba(255,255,255,.6);transition:transform .07s}
.primary:active{transform:translateY(3px)!important}
.ghost{min-height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));font:700 15px var(--display);letter-spacing:.04em;text-transform:uppercase;box-shadow:0 4px 0 rgba(3,12,18,.55),inset 0 1px 0 rgba(255,255,255,.3)}
.ghost:active{transform:translateY(3px)}
/* Spiel */
#board,#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#board{touch-action:none}#gl{pointer-events:none}
.bar{position:absolute;left:12px;right:12px;top:calc(12px + var(--sat));display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 14px 8px 8px;border-radius:20px;overflow:hidden;max-width:720px;margin:0 auto}
.bar .ib{background:rgba(255,255,255,.1);-webkit-backdrop-filter:none;backdrop-filter:none}
.bar .t{min-width:0} .bar .t b{display:block;font:700 17px/1.15 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t span{font-size:12px;color:var(--muted)}
.bar .n{text-align:right;font:700 20px/1.05 var(--display);font-variant-numeric:tabular-nums}
.bar .n small{display:block;font:600 11.5px var(--body);color:var(--muted)}
.bar .n.warn{color:var(--rose)}
.bar .prog{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--mint),var(--amber));width:0;transition:width .3s}
.tools{position:absolute;left:12px;right:12px;bottom:calc(14px + var(--sab));display:flex;justify-content:space-around;padding:8px 6px;border-radius:22px;max-width:520px;margin:0 auto}
.tb{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:56px;min-height:52px;justify-content:center;border-radius:14px;font-size:11.5px;font-weight:600;color:var(--muted);transition:transform .1s}
.tb svg{color:var(--text)} .tb.act{background:rgba(255,200,87,.18);color:var(--amber)} .tb.act svg{color:var(--amber)}
.tb:disabled{opacity:.35}
#mini{position:absolute;right:14px;top:calc(92px + var(--sat));padding:5px;border-radius:12px;line-height:0}
#mini{touch-action:none;cursor:pointer}
#mini canvas{width:108px;border-radius:7px;background:rgba(4,14,20,.7)}
#bubble{position:absolute;left:0;top:0;pointer-events:none;padding:5px 11px;border-radius:11px;font:700 15px var(--display);background:rgba(8,22,30,.85);border:1px solid var(--line);white-space:nowrap;transform:translate(-50%,0);opacity:0;transition:opacity .1s;font-variant-numeric:tabular-nums}
#bubble.on{opacity:1} #bubble.no{background:var(--rose);color:#fff;border-color:transparent} #bubble.ok{background:var(--mint);color:#06221b;border-color:transparent}

/* Sheets */
#scrim{position:fixed;inset:0;background:rgba(3,10,14,.55);opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:calc(100% - 8px - var(--sat));overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-radius:26px 26px 0 0;padding:16px 18px calc(20px + var(--sab));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.3,1);background:linear-gradient(160deg,rgba(40,66,78,.82),rgba(14,32,42,.9));display:flex;flex-direction:column;gap:12px}
#sheet>*{flex:none}
#go{position:sticky;bottom:0;z-index:3;box-shadow:0 0 0 8px rgba(18,38,48,.92),0 8px 24px rgba(255,122,89,.4)}
#sheet.on{transform:none}
@media(min-width:720px){#sheet{left:50%;right:auto;bottom:50%;width:560px;border-radius:26px;transform:translate(-50%,60%) scale(.96);opacity:0;pointer-events:none;transition:transform .25s,opacity .2s}#sheet.on{transform:translate(-50%,50%);opacity:1;pointer-events:auto}}
.sh-head{display:flex;justify-content:space-between;align-items:center}
.sh-head h2{font:700 24px var(--display)}
#sheet h3{font:700 14px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:baseline}
#sheet h3 output{font:700 15px var(--display);letter-spacing:0;text-transform:none;color:var(--amber)}
#sheet p{color:var(--muted);font-size:14px}
.pvrow{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.pvrow .frame{width:92px;height:92px;display:grid;place-items:center;border-radius:14px;background:rgba(4,14,20,.5);border:1px solid var(--line);padding:8px}
.pvrow canvas{max-width:100%;max-height:100%;width:100%;border-radius:4px}
.pvrow b{font:700 20px var(--display);display:block}
.strip{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;margin:0 -18px;padding-left:18px;padding-right:18px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.sw{position:relative;margin:0 -18px}
.sw .strip{margin:0;padding-bottom:4px;cursor:grab}
.sw::before,.sw::after{content:"";position:absolute;top:0;bottom:14px;width:40px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:1}
.sw::before{left:0;background:linear-gradient(90deg,rgba(22,44,54,.96),transparent)}
.sw::after{right:0;background:linear-gradient(270deg,rgba(22,44,54,.96),transparent)}
.sw.l::before,.sw.r::after{opacity:1}
.sw .ar{position:absolute;top:calc(50% - 12px);transform:translateY(-50%);z-index:2;width:36px;height:36px;border-radius:50%;background:rgba(8,22,30,.92);border:1px solid var(--line);display:none;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.sw .ar svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.sw .ar.p{left:8px}.sw .ar.n{right:8px}.sw .ar.n svg{transform:scaleX(-1)}
.sw.l .ar.p,.sw.r .ar.n{display:grid}
.sw .ind{display:block;height:4px;width:72px;margin:6px auto 0;border-radius:4px;background:rgba(255,255,255,.14);position:relative;overflow:hidden}
.sw .ind b{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--amber)}
.sw.fit .ind{visibility:hidden}
@media(hover:none){.sw .ar{width:30px;height:30px}}
#sizeRow.off h3 output{color:var(--muted)}
#sizeNote{font-size:12.5px!important;margin-top:2px}
.mo{flex:none;width:68px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--muted)}
.mo canvas,.mo .up{width:60px;height:60px;border-radius:13px;border:2px solid transparent;background:rgba(4,14,20,.5);object-fit:cover}
.mo .up{display:grid;place-items:center;border:2px dashed var(--line);font:700 26px var(--display);color:var(--text)}
.mo .up svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:14px 8px}.pgrid .mo{width:auto}.pgrid .mo canvas{width:100%;height:auto;aspect-ratio:1}
#sheet h3 output{font-size:12px}
#motifs{gap:7px}#motifs .mo{width:59px;font-size:11px}#motifs .mo canvas,#motifs .mo .up{width:55px;height:55px}
.mo.sel{color:var(--text)} .mo.sel canvas{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,200,87,.25)}
.pal{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--muted)}
.pal i{display:block;width:62px;height:34px;border-radius:11px;border:2px solid transparent}
.pal.sel{color:var(--text)} .pal.sel i{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,200,87,.25)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:5px;border-radius:16px;background:rgba(4,14,20,.4);border:1px solid var(--line)}
.seg button{min-height:44px;border-radius:11px;font:700 13.5px var(--display);letter-spacing:.02em;color:var(--muted)}
.stepper{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}.stepper .ib{width:40px;height:40px;font-size:22px}
#sizeRow.off .stepper{opacity:.4}
.seg button.sel{background:linear-gradient(135deg,rgba(255,200,87,.95),rgba(255,122,89,.95));color:#2a1206}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:9px;background:rgba(255,255,255,.16)}
input[type=range]::-moz-range-track{height:8px;border-radius:9px;background:rgba(255,255,255,.16)}

function applyPalette(img,ramp){
  if(!ramp)return compact(img);
  const n=img.colors.length,m=ramp.length;
  const order=[...Array(n).keys()].sort((a,b)=>lumOf(img.colors[a])-lumOf(img.colors[b]));
  const map=new Uint8Array(n);
  order.forEach((ci,rank)=>{map[ci]=n===1?(m>>1):n<=m?Math.round(rank*(m-1)/(n-1)):Math.min(m-1,Math.floor(rank*m/n))});
  const cells=new Uint8Array(img.cells.length);
  for(let i=0;i<cells.length;i++)cells[i]=map[img.cells[i]];
  return compact({W:img.W,H:img.H,colors:ramp,cells});
}

/* ---------- Foto → Pixel-Art (Median Cut) ---------- */

    let ch=0;for(let c=1;c<3;c++)if(mx[c]-mn[c]>mx[ch]-mn[ch])ch=c;return{idx,ch,range:mx[ch]-mn[ch]}};

  while(boxes.length<N){let bi=-1,best=0;boxes.forEach((b,i)=>{const s=b.range*Math.sqrt(b.idx.length);if(b.idx.length>1&&b.range>6&&s>best){best=s;bi=i}});
    if(bi<0)break;const b=boxes[bi],ch=b.ch;b.idx.sort((p,q)=>rgba[p*4+ch]-rgba[q*4+ch]);const mid=b.idx.length>>1;
    boxes.splice(bi,1,stat(b.idx.slice(0,mid)),stat(b.idx.slice(mid)))}

  boxes.forEach((b,k)=>{let s=[0,0,0];for(const i of b.idx){s[0]+=rgba[i*4];s[1]+=rgba[i*4+1];s[2]+=rgba[i*4+2];im.cells[i]=k}
    im.colors.push(rgb2hex(s[0]/b.idx.length,s[1]/b.idx.length,s[2]/b.idx.length))});

      for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const xx=x+a,yy=y+b;if(xx<0||yy<0||xx>=W||yy>=H)continue;const c=src[yy*W+xx];if(++cnt[c]>bn){bn=cnt[c];bc=c}}

function partition(W,H,cells,maxArea,rng){

    if(cov[at(x,y)])continue;

    while(x+w<W&&w<9&&!cov[at(x+w,y)]&&cells[at(x+w,y)]===col)w++;
    opts.length=0;let tot=0;
    for(let h=1;y+h<=H&&h<=9;h++){
      if(h>1){let ww=0;while(ww<w&&!cov[at(x+ww,y+h-1)]&&cells[at(x+ww,y+h-1)]===col)ww++;w=ww;if(!w)break}

/* ---------- Logik-Löser: liefert die Hinweise, die sich nicht eindeutig herleiten lassen ---------- */

    for(let y=Y0[c];y<Y0[c]+CH[c];y++)for(let x=X0[c];x<X0[c]+CW[c];x++){const i=y*W+x;if(owner[i]<0&&!inc[i]){inc[i]=1;qc[ncq++]=i}}};

      for(let y=b;y<d;y++)for(let x=a;x<c2;x++){const i=y*W+x;if(owner[i]===k)continue;owner[i]=k;

/* ---------- Rätsel bauen: zerlegen, prüfen, nachschärfen bis eindeutig ---------- */
